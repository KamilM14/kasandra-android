name: Sestavit APK Záznamník

on:
  push:
    paths:
      - 'zaznamnik-android.zip'
      - '.github/workflows/build-zaznamnik.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Rozbalit projekt
        run: |
          rm -rf srcz && mkdir srcz
          unzip -q -o zaznamnik-android.zip -d srcz
          ls srcz/zaznamnik

      - name: Sestavit APK
        run: |
          cd srcz/zaznamnik
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/zaznamnik-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: zaznamnik-apk
          path: zaznamnik-*.apk

      - name: Vydat release s APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zaznamnik-${{ github.run_number }}
          name: Záznamník build ${{ github.run_number }}
          body: "Aplikace Záznamník – nahrávání hovorů přes Shizuku, archiv posledních pěti."
          files: zaznamnik-*.apk
