name: Sestavit APK

on:
  push:
    paths:
      - 'kasandra-android.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Rozbalit projekt
        run: |
          rm -rf src && mkdir src
          unzip -q -o kasandra-android.zip -d src
          ls src/kasandra

      - name: Stáhnout český model Vosk (pro offline přepis řeči)
        run: |
          curl -sSL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-cs-0.4-rhasspy.zip
          unzip -q model.zip -d model
          d=$(ls -d model/*/ | head -1)
          mkdir -p src/kasandra/app/src/main/assets
          mv "$d" src/kasandra/app/src/main/assets/model-cs
          ls src/kasandra/app/src/main/assets/model-cs

      - name: Sestavit APK
        run: |
          cd src/kasandra
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/kasandra-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kasandra-apk
          path: kasandra-*.apk

      - name: Vydat release s APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kasandra build ${{ github.run_number }}
          body: "Testovací APK aplikace Kasandra (offline wake word). Stáhni a nainstaluj v telefonu."
          files: kasandra-*.apk
